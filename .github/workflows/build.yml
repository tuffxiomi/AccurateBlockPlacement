name: Build Accurate Block Placement

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "manifest.json"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Configure
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          cmake -S . -B build-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared

      - name: Build
        run: cmake --build build-arm64 --target levi_package --parallel

      - name: Package .levipack
        run: |
          cd build-arm64/package
          zip -r ../../AccurateBlockPlacement.levipack .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AccurateBlockPlacement-arm64
          path: |
            AccurateBlockPlacement.levipack
            build-arm64/libAccurateBlockPlacement.so
